services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minifleet
      POSTGRES_PASSWORD: minifleet
      POSTGRES_DB: minifleet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 — 5432 is often taken by a local, other Postgres services
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minifleet -d minifleet']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://minifleet:minifleet@db:5432/minifleet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-me
      PORT: '4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
